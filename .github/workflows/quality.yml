name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  guardrails:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate lint, format, and types
        run: npm run validate

      - name: Build CLI artifacts
        run: npm run build

      - name: Evaluate recommendation fixtures
        run: npm run validate:recommendations
