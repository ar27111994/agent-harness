name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  guardrails-matrix:
    name: guardrails (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    concurrency:
      group: quality-${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true

    steps:
      - name: Check out repository
        # actions/checkout@v4
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Node.js
        # actions/setup-node@v4
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate lint, format, and types
        run: npm run validate

      - name: Build CLI artifacts
        run: npm run build

      - name: Run unit and integration tests with coverage
        run: npm run test:coverage

      - name: Publish coverage summary
        shell: bash
        run: |
          node <<'EOF'
          const fs = require('node:fs');
          const summary = JSON.parse(
            fs.readFileSync('coverage/coverage-summary.json', 'utf8'),
          ).total;
          const lines = [
            '## Coverage summary',
            '',
            '| Metric | Covered | Total | Pct |',
            '| --- | ---: | ---: | ---: |',
            `| Statements | ${summary.statements.covered} | ${summary.statements.total} | ${summary.statements.pct}% |`,
            `| Branches | ${summary.branches.covered} | ${summary.branches.total} | ${summary.branches.pct}% |`,
            `| Functions | ${summary.functions.covered} | ${summary.functions.total} | ${summary.functions.pct}% |`,
            `| Lines | ${summary.lines.covered} | ${summary.lines.total} | ${summary.lines.pct}% |`,
          ];
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `${lines.join('\n')}\n`,
          );
          EOF

      - name: Run self-hosting integration suite
        run: npm run test:self-hosting

      - name: Run scan benchmark budget
        run: npm run benchmark:scan

      - name: Run detection quality report
        run: npm run quality:detection

      - name: Run recommendation policy coverage report
        run: npm run quality:policy

      - name: Run CLI and wire preview/apply/reset smoke checks
        run: npm run smoke:cli

      - name: Run offline workspace lifecycle smoke checks
        run: npm run smoke:workspace

      - name: Evaluate recommendation fixtures
        run: npm run validate:recommendations

      - name: Run packed artifact smoke check
        run: npm run smoke:pack

  guardrails:
    name: guardrails
    runs-on: ubuntu-latest
    needs: guardrails-matrix
    if: always()
    timeout-minutes: 5
    steps:
      - name: Verify matrix guardrails completed
        run: |
          if [ "${{ needs.guardrails-matrix.result }}" != "success" ]; then
            echo "guardrails-matrix completed with result: ${{ needs.guardrails-matrix.result }}"
            exit 1
          fi

          echo "All matrix guardrails completed successfully."
