name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  guardrails:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    concurrency:
      group: quality-${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true

    steps:
      - name: Check out repository
        # actions/checkout@v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        # actions/setup-node@v4
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate lint, format, and types
        run: npm run validate

      - name: Build CLI artifacts
        run: npm run build

      - name: Run unit and integration tests
        run: npm test

      - name: Run scan benchmark budget
        run: npm run benchmark:scan

      - name: Run CLI and wire preview smoke checks
        run: npm run smoke:cli

      - name: Evaluate recommendation fixtures
        run: npm run validate:recommendations
