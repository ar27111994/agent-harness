name: Maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  discovery-maintenance:
    name: Discovery and catalogue maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        # actions/checkout@v6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        # actions/setup-node@v6
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # #414: Restore discovery state cache from prior runs so repo-kind
      # sources with cached GitHub API data don't appear as dormant.
      # The save step uses run-specific keys; restore-keys matches any prior run.
      - name: Restore discovery cache
        id: discovery-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            state/discover/source-sync.json
            state/discover/source-sync.entries.jsonl
          key: agent-harness-discovery-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            agent-harness-discovery-cache-

      - name: Build
        run: npm run build

      - name: Refresh discovery reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_HARNESS_SOURCE_SYNC_MAX_PAGES_PER_RUN: "1"
          AGENT_HARNESS_GENERIC_REFERENCE_MAX_ITEMS: "50"
          AGENT_HARNESS_VSCODE_MARKETPLACE_MAX_QUERIES: "2"
          AGENT_HARNESS_VSCODE_MARKETPLACE_MAX_ITEMS_PER_QUERY: "10"
        run: |
          npm run discover:sources
          npm run discover:sync
          npm run discover:sources
          npm run discover:catalog
          npm run discover:select -- --no-ai-enrich
          npm run discover:stats
          npm run recommend:report -- --intent general
          node ./dist/cli.js install refresh --host copilot-vscode --due-only
          node ./scripts/maintenance-summary.mjs
          node ./scripts/maintenance-bot-plan.mjs

      # #414: Persist discovery state cache for the next CI run.
      # Uses a run-specific key so each run saves a fresh cache entry;
      # the restore step matches via the stable restore-keys prefix.
      - name: Save discovery cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state/discover/source-sync.json
            state/discover/source-sync.entries.jsonl
          key: agent-harness-discovery-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload maintenance artifacts
        # actions/upload-artifact@v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agent-harness-maintenance-reports
          if-no-files-found: warn
          path: |
            discover/output/*.json
            discover/output/*.jsonl
            discover/output/maintenance-summary.md
            discover/output/maintenance-bot-plan.json
            state/install/refresh-report.json
            state/install/refresh-state.json
