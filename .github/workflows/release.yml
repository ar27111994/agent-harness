name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  NPM_VERSION: "11.5.1"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-checks:
    name: release checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        # actions/checkout@v4
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node.js
        # actions/setup-node@v4
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install npm with trusted publishing support
        run: |
          npm install --global npm@${{ env.NPM_VERSION }}
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run release validation
        run: npm run validate:release

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Verify packed artifact contents
        run: npm pack --dry-run --json --ignore-scripts

      - name: Verify publish dry run
        run: npm publish --dry-run --ignore-scripts --access public

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: release-checks
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        # actions/checkout@v4
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node.js
        # actions/setup-node@v4
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install npm with trusted publishing support
        run: |
          npm install --global npm@${{ env.NPM_VERSION }}
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Build package
        run: npm run build

      - name: Publish package with npm trusted publishing
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --ignore-scripts --access public
