name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  NPM_VERSION: "11.5.1"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-checks:
    name: release checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        # actions/checkout@v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history so check:version-sync's tag-vs-manifest guard (#467)
          # can enumerate released tags; also validates the pushed tag exists.
          fetch-depth: 0

      - name: Set up Node.js
        # actions/setup-node@v4
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install npm with trusted publishing support
        run: |
          npm install --global npm@${{ env.NPM_VERSION }}
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$PACKAGE_VERSION" != "$TAG_VERSION" ]]; then
              echo "Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)." >&2
              exit 1
            fi
          else
            echo "Non-tag run on $GITHUB_REF_NAME; skipping tag/package version enforcement."
          fi

      - name: Determine npm dist-tag
        id: npm-dist-tag
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            echo "value=next" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether version is already published
        id: npm-version-published
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "value=true" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published."
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run release validation
        run: npm run validate:release

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Verify packed artifact contents
        run: npm run release:package-audit

      - name: Smoke test packed package
        if: matrix.os == 'ubuntu-latest'
        run: npm run release:package-smoke

      - name: Verify publish dry run
        if: matrix.os == 'ubuntu-latest' && !(github.event_name == 'workflow_dispatch' && steps.npm-version-published.outputs.value == 'true')
        run: npm publish --dry-run --ignore-scripts --access public --tag ${{ steps.npm-dist-tag.outputs.value }}

  publish:
    name: publish
    runs-on: ubuntu-latest
    # #485: drop the old single `release-checks` dependency and gate the
    # irreversible npm publish on BOTH release-checks AND github-release. The
    # github-release job regenerates + schema-validates the ARD catalog, so this
    # makes npm publish wait for every validation gate (ARD included) to pass.
    needs: [release-checks, github-release]
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
    permissions:
      id-token: write

    steps:
      - name: Check out repository
        # actions/checkout@v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history so check:version-sync's tag-vs-manifest guard (#467)
          # can enumerate released tags; also validates the pushed tag exists.
          fetch-depth: 0

      - name: Set up Node.js
        # actions/setup-node@v4
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install npm with trusted publishing support
        run: |
          npm install --global npm@${{ env.NPM_VERSION }}
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$PACKAGE_VERSION" != "$TAG_VERSION" ]]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)." >&2
            exit 1
          fi

      - name: Determine npm dist-tag
        id: npm-dist-tag
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            echo "value=next" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether version is already published
        id: npm-version-published
        shell: bash
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "value=true" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published; publish step will be skipped."
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Build package
        run: npm run build

      - name: Verify packed artifact contents
        run: npm run release:package-audit

      - name: Smoke test packed package
        run: npm run release:package-smoke

      - name: Publish package with npm trusted publishing
        if: github.event_name != 'workflow_dispatch' || steps.npm-version-published.outputs.value != 'true'
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --ignore-scripts --access public --tag ${{ steps.npm-dist-tag.outputs.value }} --provenance

  github-release:
    name: github release
    runs-on: ubuntu-latest
    # #485: github-release has NO dependency on the published npm artifact
    # (it only creates/updates the tagged GitHub release and uploads the ARD
    # catalog it regenerates for the tag), so it runs off release-checks rather
    # than publish. This moves its ARD catalog regeneration + schema validation
    # BEFORE the irreversible npm publish, so a failure there (empty catalog,
    # schema mismatch) stops npm from going live instead of stranding it behind
    # a stuck draft release.
    needs: release-checks
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        # actions/checkout@v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history so check:version-sync's tag-vs-manifest guard (#467)
          # can enumerate released tags; also validates the pushed tag exists.
          fetch-depth: 0

      - name: Set up Node.js
        # actions/setup-node@v4
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Create or update GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: npm run release:github

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate committed ARD catalog for the tag
        run: |
          # #484: pin the release ARD asset to the tag's committed catalog
          # instead of regenerating via `discover full` + `ard-export`. A fresh
          # (cold) CI checkout has no tracked discovery state, so regeneration
          # can produce a 0-entry catalog — which ard-export now rejects, but
          # that would block the release on a cold tree. The committed
          # .well-known/ai-catalog.json is git-tracked, always present at the
          # tag, and non-empty (kept live/repaired under #488). Assert it is
          # non-empty and schema-valid (reusing #486's guard) before uploading
          # it as the release's ARD asset.
          if [ ! -s .well-known/ai-catalog.json ]; then
            echo "FAIL: committed ARD catalog .well-known/ai-catalog.json is empty — release blocked." >&2
            exit 1
          fi
          node ./scripts/validate-ard-schema.mjs .well-known/ai-catalog.json
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload ARD catalog to release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG_NAME" .well-known/ai-catalog.json \
            --repo ${{ github.repository }} \
            --clobber
