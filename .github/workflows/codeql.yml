name: CodeQL

# Committed CodeQL scanning workflow (issue #481).
#
# WHY THIS EXISTS (and why it is not "just leave GitHub default-setup on"):
# GitHub's *default setup* CodeQL silently skips scanning on large PRs and on
# pushes that exceed its size/trigger limits (that is exactly what happened to
# PR #478: 133 files / 75 commits). A committed workflow with explicit `on:`
# triggers runs on EVERY push and pull_request regardless of diff size, so
# scanning (and the CodeQL check) actually reports even on large changesets.
#
# CHECK-NAME RECONCILIATION:
# This workflow has a SINGLE un-matrixed job whose `name:` is literally
# `CodeQL`. GitHub sets a check run's name to the job's `name` when there is no
# matrix, so the check context this workflow emits is exactly `CodeQL` — the
# precise context the default ruleset's required_status_checks referenced. It
# stays satisfiable if the ruleset re-requires it, and it does NOT collide with
# GitHub default-setup's emitted checks (`Analyze (...)`). Scanning is pinned to
# `javascript-typescript` (the only language this repository ships).
#
# DEFAULT-SETUP MUTUAL EXCLUSIVITY (READ THIS):
# GitHub enforces that a repository runs EITHER default setup OR an advanced
# (committed) CodeQL workflow — NOT both. While default setup is enabled, the
# analyze step's SARIF upload is REJECTED outright:
#   "CodeQL analyses from advanced configurations cannot be processed when the
#    default setup is enabled"
# so this workflow cannot report until default setup is DISABLED. Disabling it
# is a one-click repo/human setting (Settings -> Code security -> Code scanning
# -> Disable default setup), not something this file can do. The ordering on
# the default branch must therefore be: (1) disable default setup, then
# (2) this workflow lands and takes over scanning. Until then this job fails on
# the SARIF upload by design, not by defect — the workflow itself is correct
# and will go green the moment the toggle is flipped.

on:
  push:
    branches: ["main", "release/**"]
  pull_request:
    # The branches array must be present for the analysis to run on PRs. It is
    # scoped so the scan covers both main and the release-staging branch that
    # large PRs actually target (the v2.1.1 campaign lives on release/**).
    branches: ["main", "release/**"]
  schedule:
    # Weekly scan so newly-disclosed vulnerabilities in released code are
    # caught even when no PR/push lands.
    - cron: "31 13 * * 1"

# Uploading SARIF to the code-scanning API requires security-events write;
# actions/read is needed by the codeql-action to list code paths for upload.
permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  CodeQL:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: codeql-${{ github.ref }}-${{ github.workflow }}
      cancel-in-progress: true

    steps:
      - name: Check out repository
        # actions/checkout@v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history so CodeQL can trust ref comparisons (and so the
          # analysis sees the whole tree, not just the PR head's shallow slice).
          fetch-depth: 0

      - name: Initialize CodeQL
        # github/codeql-action/init@v4 (pinned by SHA)
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          languages: javascript-typescript
          queries: security-and-quality
          # build-mode: none extracts JavaScript/TypeScript straight from source
          # (no compile step is required for the JS/TS extractor), so the scan
          # can never be skipped or fail on a build. default-setup effectively
          # does the same extraction but is subject to its size/trigger ceiling;
          # the explicit triggers below are what lift that ceiling.
          build-mode: none

      - name: Perform CodeQL analysis
        # github/codeql-action/analyze@v4 (pinned by SHA).
        # The `code_scanning` tool (SARIF upload) is produced by this step.
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938
