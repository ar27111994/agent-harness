version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    # typescript@7 (native compiler) is blocked by typescript-eslint peer
    # dependency ">=4.8.4 <6.1.0" — installing it fails `npm ci` with ERESOLVE.
    # Remove this ignore once typescript-eslint ships TS 7 support.
    ignore:
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      npm-version-updates:
        patterns:
          - "*"
      npm-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    groups:
      github-actions-version-updates:
        patterns:
          - "*"
      github-actions-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
